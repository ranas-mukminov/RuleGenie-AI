[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rulegenie"
version = "0.1.0"
description = "RuleGenie AI – AI-assisted detection rule generator and evaluator for SOC teams."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RuleGenie AI Team", email = "dev@rulegenie.local" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.23.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0"
]

[project.scripts]
rulegenie = "rulegenie.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]
